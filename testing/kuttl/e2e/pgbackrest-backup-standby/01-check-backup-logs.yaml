apiVersion: kuttl.dev/v1beta1
kind: TestStep
commands:
# First, find the backup job pods.
# Then, check their logs for the 'unable to find standby cluster' line.
# If this line isn't found, exit 1.
- script: |
    contains() { bash -ceu '[[ "$1" == *"$2"* ]]' - "$@"; }

    selector='postgres-operator.crunchydata.com/cluster=pgbackrest-backup-standby,postgres-operator.crunchydata.com/pgbackrest-backup=replica-create'

    # The Job is meant to fail, so Kubernetes replaces its Pod and more than one
    # Pod carries the label. Some of those Pods exit on the pgBackRest config
    # hash comparison before a backup runs, so read every Pod rather than
    # assuming the first one reached pgBackRest.
    for _ in $(seq 30); do
      pods=$(kubectl get pods -o name -n "${NAMESPACE}" -l "${selector}")

      for pod in ${pods}; do
        logs=$(kubectl logs "${pod}" --namespace "${NAMESPACE}") || true
        contains "${logs}" 'unable to find standby cluster - cannot proceed' && found="${pod}" && break
      done

      [ -n "${found}" ] && break
      printf 'Expected error not found\nSleeping...\n'
      sleep 5
    done

    [ -n "${found}" ] || {
      echo 'did not find expected standby cluster error'
      for pod in ${pods}; do
        echo "--- ${pod}"
        kubectl get "${pod}" --namespace "${NAMESPACE}" \
          -o 'jsonpath=exit code: {.status.containerStatuses[*].state.terminated.exitCode}{"\n"}'
        kubectl logs "${pod}" --namespace "${NAMESPACE}" || true
      done
      exit 1
    }
